[project]
name = "pearl-from-scratch"
version = "0.1.0"
description = "PEARL (Rakelly et al. 2019) rebuilt from scratch in PyTorch"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.2.2",
  "numpy==1.26.4",
  "matplotlib==3.8.4",
]

[project.optional-dependencies]
dev = ["pytest==8.2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pearl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
